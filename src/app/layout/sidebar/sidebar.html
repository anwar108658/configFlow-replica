@if (open) {
	<button class="sidebar-scrim" aria-label="Close navigation" (click)="close.emit()"></button>
}
<aside class="sidebar" [class.sidebar-open]="open">
	<a class="brand" href="#" (click)="$event.preventDefault(); sectionChange.emit('Dashboard'); close.emit()">
		<span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
		<span>ConfigFlow</span>
	</a>
	<nav class="nav-list" aria-label="Workspace navigation">
		<span class="nav-label">Workspace</span>
		@for (item of navigation; track item.label) {
			<button
				class="z-button z-button-ghost nav-item"
				[class.active]="activeSection === item.label"
				[attr.aria-current]="activeSection === item.label ? 'page' : null"
				(click)="sectionChange.emit(item.label); close.emit()"
			>
				<ng-icon [name]="item.icon" size="18" />
				<span>{{ item.label }}</span>
				@if (item.count) { <span class="nav-count">{{ item.count }}</span> }
			</button>
		}
	</nav>
	<button class="z-button z-button-secondary workspace-card">
		<span class="workspace-icon"><ng-icon name="lucideGlobe2" size="16" /></span>
		<span class="workspace-copy"><strong>Acme workspace</strong><small>Enterprise plan</small></span>
		<ng-icon name="lucideChevronRight" size="15" />
	</button>
	<div class="sidebar-profile">
		<span class="avatar avatar-owner">AJ</span>
		<span class="profile-copy"><strong>Alex Johnson</strong><small>Administrator</small></span>
		<button class="z-button z-button-ghost profile-menu" aria-label="Profile menu">
			<ng-icon name="lucideEllipsis" size="18" />
		</button>
	</div>
</aside>
